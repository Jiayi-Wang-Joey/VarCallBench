metric_collectors:
  - id: happy_summary_collector
    name: "hap.py summary (all callers, all coverage cutoffs)"
    software_environment: r_plot_env
    repository:
      url: "https://github.com/Jiayi-Wang-Joey/VarCallbench-longBench.git"
      commit: "main"
    parameters:
      - id: default
        values:
          - "--task"
          - "happy_summary_collector"
    inputs:
      - happy_variant_call.csv
      - happy_isolaser.csv
    outputs:
      - id: happy_summary_merged.csv
        path: "{name}/happy_summary_merged.csv"